services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Bookify!Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BookConnection: "Server=db,1433;Database=BookDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Bookify!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Startup__MigrateOnStartup: "true"
      Startup__SeedAdmin: "true"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-admin@bookify.local}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-Admin@12345}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqlserver-data:
