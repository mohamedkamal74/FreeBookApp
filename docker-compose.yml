services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Bookify!Passw0rd}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # port probe — works on every 2022 image, regardless of sqlcmd tooling path
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Https__Redirect: "false"
      ConnectionStrings__BookConnection: "Server=db,1433;Database=BookDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Bookify!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Startup__MigrateOnStartup: "true"
      Startup__SeedAdmin: "true"
      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME:-}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY:-}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET:-}"
      Cloudinary__Folder: "${CLOUDINARY_FOLDER:-bookify}"
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-admin@bookify.local}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-Admin@12345}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sqlserver-data:
